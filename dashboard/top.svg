<svg xmlns="http://www.w3.org/2000/svg" width="900" height="459" viewBox="0 0 900 459" role="img" aria-label="Akhilesh, Dev Dashboard. About me: CSE student at Chitkara University, Punjab, India">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98560"/><stop offset=".22" stop-color="#a95d3b"/><stop offset=".5" stop-color="#4a281c"/><stop offset="1" stop-color="#120e0d"/></linearGradient>
<radialGradient id="glow" cx=".3" cy=".05" r=".7"><stop offset="0" stop-color="#ffd2ae" stop-opacity=".45"/><stop offset="1" stop-color="#ffd2ae" stop-opacity="0"/></radialGradient>
<pattern id="dw" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#f4f4f4"/></pattern>
<pattern id="dt" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#ffe3d0"/></pattern>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#181818"/><stop offset="1" stop-color="#181818" stop-opacity="0"/></linearGradient>
<linearGradient id="fr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#181818" stop-opacity="0"/><stop offset="1" stop-color="#181818"/></linearGradient>
<filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000" flood-opacity=".5"/></filter>
