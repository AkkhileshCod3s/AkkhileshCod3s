<style>
text{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Courier New',monospace}
.l{font-size:9.5px;fill:#8b8b8b;letter-spacing:1.2px}
.s{font-size:9px;fill:#8b8b8b;letter-spacing:1px}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:sp 40s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.blink{animation:bk 1.2s steps(1) infinite}
@keyframes bk{50%{opacity:.15}}
.mq{animation:mq 40s linear infinite}
@keyframes mq{to{transform:translateX(-2106px)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.mq{animation:none}}
</style>
<g clip-path="url(#cv)"><rect width="900" height="1026" fill="url(#bg)"/><rect width="900" height="1026" fill="url(#glow)"/></g>
<text x="44" y="84" font-size="58" font-weight="900" letter-spacing="5" fill="url(#dw)">AKHILESH</text><text x="44" y="124" font-size="27" font-weight="900" letter-spacing="3" fill="url(#dt)">DEV DASHBOARD</text><g transform="translate(30,160)"><rect width="840" height="284" rx="18" fill="#181818" stroke="#2b2b2b" filter="url(#sh)"/><text x="18" y="28" class="l">01  ABOUT ME</text><text x="30" y="64" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">Hey there, I'm </tspan><tspan fill="#ff5a36" font-weight="800">Akhilesh</tspan><tspan fill="#ececec" font-weight="400"> 👋, a Computer Science &amp; Engineering student at</tspan></text><text x="30" y="85" font-size="13" xml:space="preserve"><tspan fill="#ff5a36" font-weight="800">Chitkara University</tspan><tspan fill="#ececec" font-weight="400">, based in Punjab, India.</tspan></text><text x="30" y="118" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">I enjoy turning ideas into clean, fast and thoughtful web experiences.</tspan></text><text x="30" y="139" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">My strength is </tspan><tspan fill="#ff5a36" font-weight="800">front-end web engineering</tspan><tspan fill="#ececec" font-weight="400">, backed by solid fundamentals</tspan></text><text x="30" y="160" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">in </tspan><tspan fill="#ff5a36" font-weight="800">Object-Oriented Programming with Java</tspan><tspan fill="#ececec" font-weight="400"> and </tspan><tspan fill="#ff5a36" font-weight="800">data structures</tspan><tspan fill="#ececec" font-weight="400">.</tspan></text><text x="30" y="181" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">I'm always learning and always shipping.</tspan></text><text x="30" y="214" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">This profile is my little corner of the internet: a home for my</tspan></text><text x="30" y="235" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">academic coursework, exam preparation notes and the modern web apps I</tspan></text><text x="30" y="256" font-size="13" xml:space="preserve"><tspan fill="#ececec" font-weight="400">build along the way. If something catches your eye, say hi! 🚀</tspan></text><line x1="648" y1="26" x2="648" y2="258" stroke="#2b2b2b"/><g class="spin"><circle cx="744.0" cy="40.0" r="1.7" fill="#ff5a36"/><circle cx="748.6" cy="40.2" r="1.7" fill="#ff5a36"/><circle cx="753.1" cy="41.0" r="1.7" fill="#cfcfcf"/><circle cx="757.6" cy="42.2" r="1.7" fill="#cfcfcf"/><circle cx="761.9" cy="43.8" r="1.7" fill="#cfcfcf"/><circle cx="766.0" cy="45.9" r="1.7" fill="#cfcfcf"/><circle cx="769.9" cy="48.4" r="1.7" fill="#cfcfcf"/><circle cx="773.4" cy="51.3" r="1.7" fill="#cfcfcf"/><circle cx="776.7" cy="54.6" r="1.7" fill="#cfcfcf"/><circle cx="779.6" cy="58.1" r="1.7" fill="#cfcfcf"/><circle cx="782.1" cy="62.0" r="1.7" fill="#cfcfcf"/><circle cx="784.2" cy="66.1" r="1.7" fill="#cfcfcf"/><circle cx="785.8" cy="70.4" r="1.7" fill="#cfcfcf"/><circle cx="787.0" cy="74.9" r="1.7" fill="#cfcfcf"/><circle cx="787.8" cy="79.4" r="1.7" fill="#cfcfcf"/><circle cx="788.0" cy="84.0" r="1.7" fill="#cfcfcf"/><circle cx="787.8" cy="88.6" r="1.7" fill="#cfcfcf"/><circle cx="787.0" cy="93.1" r="1.7" fill="#cfcfcf"/><circle cx="785.8" cy="97.6" r="1.7" fill="#cfcfcf"/><circle cx="784.2" cy="101.9" r="1.7" fill="#cfcfcf"/><circle cx="782.1" cy="106.0" r="1.7" fill="#cfcfcf"/><circle cx="779.6" cy="109.9" r="1.7" fill="#cfcfcf"/><circle cx="776.7" cy="113.4" r="1.7" fill="#cfcfcf"/><circle cx="773.4" cy="116.7" r="1.7" fill="#cfcfcf"/><circle cx="769.9" cy="119.6" r="1.7" fill="#cfcfcf"/><circle cx="766.0" cy="122.1" r="1.7" fill="#cfcfcf"/><circle cx="761.9" cy="124.2" r="1.7" fill="#cfcfcf"/><circle cx="757.6" cy="125.8" r="1.7" fill="#cfcfcf"/><circle cx="753.1" cy="127.0" r="1.7" fill="#cfcfcf"/><cir